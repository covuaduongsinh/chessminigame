[package]
name = "duongsinh-chess"
version = "0.1.0"
description = "Dương Sinh Chess — ứng dụng học cờ vua cho trẻ em (bản desktop)"
authors = ["Công ty CP Cờ vua Dương Sinh"]
license = "MIT"
repository = "https://github.com/covuaduongsinh/chessminigame"
edition = "2024"
rust-version = "1.90"

[lib]
name = "duongsinh_chess_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
