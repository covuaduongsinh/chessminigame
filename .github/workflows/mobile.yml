name: Mobile (EAS)

# Build iOS/Android trên Expo Application Services.
# Cần secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Hồ sơ build trong eas.json
        type: choice
        options: [preview, production, development]
        default: preview
      platform:
        description: Nền tảng
        type: choice
        options: [all, android, ios]
        default: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Chưa có secret EXPO_TOKEN. Vào Settings → Secrets and variables → Actions để thêm."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - name: EAS build
        working-directory: apps/app
        run: eas build --profile ${{ inputs.profile }} --platform ${{ inputs.platform }} --non-interactive --no-wait
