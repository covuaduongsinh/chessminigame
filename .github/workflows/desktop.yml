name: Desktop (Tauri)

# Build bộ cài Windows / macOS / Linux và tạo bản nháp Release.
# Chạy khi đẩy tag dạng v0.1.0, hoặc bấm tay (Actions → Desktop → Run workflow) và nhập phiên bản;
# tag được tạo khi Thầy bấm Publish bản nháp.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Phiên bản phát hành (ví dụ v0.1.0)
        required: true
        default: v0.1.0

jobs:
  # Xóa bản nháp cũ cùng phiên bản (nếu có) để build lại không bị lỗi "file đã tồn tại".
  # Chỉ đụng tới bản nháp; Release đã Publish thì giữ nguyên.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - name: Xóa bản nháp cũ của ${{ env.TAG }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft and .tag_name == env.TAG) | .id' |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/{}"

  build:
    needs: prepare
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Thư viện hệ thống (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: Dương Sinh Chess ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseBody: Bản cài đặt Dương Sinh Chess cho Windows, macOS và Linux.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
